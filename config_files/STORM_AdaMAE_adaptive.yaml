Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: True

JointTrainAgent:
  SampleMaxSteps: 50000
  BufferMaxLength: 50000
  BufferWarmUp: 1024
  NumEnvs: 1
  BatchSize: 16
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 1024
  ImagineDemonstrationBatchSize: 256
  ImagineContextLength: 8
  ImagineBatchLength: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: False
  SaveEverySteps: 5000

Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8
    # progressive masking
    UseProgressiveMasking: False
    UseProgressiveInKVCache: False
    UseMildDecayInKV: False
    FixedMaskPercent: 0.0  # Change this for 0%, 5%, 15%, etc.
    UseRandomMask: False    # oldest-first masking  
    UseSoftPenalty: False    # soft penalties
    # AdaMAE spatial masking
    UseMaskSchedule: True  # Adaptive masking schedule
    MaskRatio: 0.75  # Final target (not used with schedule)
    MaskRatioStart: 0.25  # Start with 25% masking (12 visible tokens)
    MaskRatioEnd: 0.75  # Ramp up to 75% masking (4 visible tokens)
    MaskWarmupSteps: 20000  # Ramp over 20k steps

  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4

  NoveltyDetection:
    Enabled: False
    HistoryLength: 100
    DetectionThresholdPercentile: 95.0
    MinSamplesForDetection: 50
    EnableAdaptiveThreshold: True
    EIGThreshold: 0.0
    UseEIGPrimary: True
    LogDetections: False
    SaveDetectionLog: False
    DetectionLogPath: "detection_logs/"

NoveltyTesting:
  Enabled: False
  NoveltyType: "visual_noise"
  NoveltyParams:
    noise_std: 30.0
    shift_type: "red"
    mask_ratio: 0.3
    kernel_size: 15
    angle: 15.0
  NoveltyStartStep: 100
