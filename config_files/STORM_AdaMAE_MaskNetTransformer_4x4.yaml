Task: "JointTrainAgent"

BasicSettings:
  Seed: 0
  ImageSize: 64
  ReplayBufferOnGPU: True

JointTrainAgent:
  SampleMaxSteps: 50000
  BufferMaxLength: 50000
  BufferWarmUp: 1024
  NumEnvs: 1
  BatchSize: 16
  DemonstrationBatchSize: 4
  BatchLength: 64
  ImagineBatchSize: 1024
  ImagineDemonstrationBatchSize: 256
  ImagineContextLength: 8
  ImagineBatchLength: 16
  TrainDynamicsEverySteps: 1
  TrainAgentEverySteps: 1
  UseDemonstration: False
  SaveEverySteps: 2500

Models:
  WorldModel:
    InChannels: 3
    TransformerMaxLength: 64
    TransformerHiddenDim: 512
    TransformerNumLayers: 2
    TransformerNumHeads: 8
    # Progressive masking (temporal attention masking)
    UseProgressiveMasking: False
    UseProgressiveInKVCache: False
    UseMildDecayInKV: False
    FixedMaskPercent: 0.0
    UseRandomMask: False
    UseSoftPenalty: False
    # AdaMAE-specific settings (4×4 = 16 tokens per frame)
    MaskRatio: 0.50            # Fallback ratio (not used when MaskNet enabled)
    UseMaskSchedule: False     # Not using scheduled masking (MaskNet learns the ratio)
    UseMaskNet: True           # ENABLED: Learn both which tokens AND how many to mask
    MaskNetType: "transformer" # NEW: Use transformer-based MaskNet (with residuals + LayerNorm)
    MaskRatioStart: 0.10       # Not used when UseMaskNet=True
    MaskRatioEnd: 0.50         # Max allowed masking ratio
    MaskWarmupSteps: 10000     # MaskNet has 10k warmup at 10% before learning

  Agent:
    NumLayers: 2
    HiddenDim: 512
    Gamma: 0.985
    Lambda: 0.95
    EntropyCoef: 3E-4

  NoveltyDetection:
    Enabled: True
    HistoryLength: 100
    DetectionThresholdPercentile: 95.0
    MinSamplesForDetection: 50
    EnableAdaptiveThreshold: True
    EIGThreshold: 0.0
    UseEIGPrimary: True
    LogDetections: True
    SaveDetectionLog: True
    DetectionLogPath: "detection_logs/"

NoveltyTesting:
  Enabled: False
  NoveltyType: "visual_noise"
  NoveltyParams:
    noise_std: 30.0
    shift_type: "red"
    mask_ratio: 0.3
    kernel_size: 15
    angle: 15.0
  NoveltyStartStep: 100

